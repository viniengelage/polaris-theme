<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Polaris">
  <title>Polaris</title>
  <defs>
    <clipPath id="tile">
      <rect width="512" height="512" rx="112" ry="112" />
    </clipPath>
    <!-- o bloom do design system: violeta-800 difuso, um único foco luminoso -->
    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6D28D9" stop-opacity="0.50" />
      <stop offset="45%" stop-color="#6D28D9" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0" />
    </radialGradient>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#08070C" />
    <circle cx="256" cy="246" r="200" fill="url(#bloom)" />

    <!-- satélites: cada uma é um accent da paleta de sintaxe.
         Tamanhos irregulares de propósito — somem antes da estrela ao reduzir. -->
    <path transform="translate(118 128) scale(0.15)" fill="#2DD4BF"
      d="M100 0C100 98.4 118 120 200 120C118 120 100 141.6 100 240C100 141.6 82 120 0 120C82 120 100 98.4 100 0Z" />
    <path transform="translate(368 152) scale(0.10)" fill="#60A5FA"
      d="M100 0C100 98.4 118 120 200 120C118 120 100 141.6 100 240C100 141.6 82 120 0 120C82 120 100 98.4 100 0Z" />
    <path transform="translate(352 344) scale(0.13)" fill="#E8B368"
      d="M100 0C100 98.4 118 120 200 120C118 120 100 141.6 100 240C100 141.6 82 120 0 120C82 120 100 98.4 100 0Z" />
    <path transform="translate(148 372) scale(0.07)" fill="#D8B4FE"
      d="M100 0C100 98.4 118 120 200 120C118 120 100 141.6 100 240C100 141.6 82 120 0 120C82 120 100 98.4 100 0Z" />

    <!-- Polaris: raio vertical 120 contra horizontal 100. A assimetria é o que
         faz ler como estrela polar e não como sparkle genérico de UI. -->
    <path transform="translate(156 136)" fill="#C084FC"
      d="M100 0C100 98.4 118 120 200 120C118 120 100 141.6 100 240C100 141.6 82 120 0 120C82 120 100 98.4 100 0Z" />
  </g>

  <rect x="0.5" y="0.5" width="511" height="511" rx="111.5" ry="111.5"
    fill="none" stroke="#FFFFFF" stroke-opacity="0.08" />
</svg>
